<!doctype html>
<html lang="en">
	<head>
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				websocket.onopen = () => {
					websocket.send(
						JSON.stringify({
							event: inRegisterEvent,
							uuid: inPropertyInspectorUUID,
						}),
					);
				};

				const device = document.getElementById("device");
				const profile = document.getElementById("profile");
				const anticlockwise = document.getElementById("anticlockwise");
				const clockwise = document.getElementById("clockwise");

				let storedProfilesMap = {};

				function populateSelect(selectElement, values, currentValue) {
					selectElement.innerHTML = "";
					const items = Array.from(new Set(values));
					if (currentValue && !items.includes(currentValue)) {
						items.push(currentValue);
					}
					for (const val of items) {
						selectElement.appendChild(new Option(val, val, false, val === currentValue));
					}
					selectElement.value = currentValue ?? items[0] ?? "";
				}

				function updateDeviceSelect(devicesList) {
					const currentDev = device.value || (inActionInfo.payload.settings.device ?? inActionInfo.device);
					populateSelect(device, devicesList, currentDev);
				}

				function getAvailableProfiles(targetDevice) {
					if (targetDevice && storedProfilesMap[targetDevice]) {
						return storedProfilesMap[targetDevice];
					}
					const allProfiles = Object.values(storedProfilesMap).flat();
					return allProfiles.length > 0 ? allProfiles : ["Default"];
				}

				function populateAllProfiles() {
					const targetDevice = device.value || inActionInfo.device;
					const profilesList = getAvailableProfiles(targetDevice);

					const currentProfile = profile.dataset.savedValue ?? (inActionInfo.payload.settings.profile ?? "Default");
					const currentAnti = anticlockwise.dataset.savedValue ?? (inActionInfo.payload.settings.anticlockwise ?? "Default");
					const currentClock = clockwise.dataset.savedValue ?? (inActionInfo.payload.settings.clockwise ?? "Default");

					populateSelect(profile, profilesList, currentProfile);
					populateSelect(anticlockwise, profilesList, currentAnti);
					populateSelect(clockwise, profilesList, currentClock);
				}

				updateDeviceSelect([]);

				profile.dataset.savedValue = inActionInfo.payload.settings.profile ?? "Default";
				anticlockwise.dataset.savedValue = inActionInfo.payload.settings.anticlockwise ?? "Default";
				clockwise.dataset.savedValue = inActionInfo.payload.settings.clockwise ?? "Default";

				populateAllProfiles();

				if (inActionInfo.payload.controller == "Encoder") {
					document.getElementById("encoder").style.display = "block";
					document.getElementById("up-label").innerText = "Dial press";
				}

				update = () => {
					profile.dataset.savedValue = profile.value;
					anticlockwise.dataset.savedValue = anticlockwise.value;
					clockwise.dataset.savedValue = clockwise.value;

					websocket.send(
						JSON.stringify({
							event: "setSettings",
							context: inActionInfo.context,
							payload: {
								device: device.value ?? inActionInfo.device,
								profile: profile.value,
								anticlockwise: anticlockwise.value,
								clockwise: clockwise.value,
							},
						}),
					);
				};

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);
					if (data.event == "sendToPropertyInspector" && data.payload.event == "updateDevices") {
						if (data.payload.devices) {
							updateDeviceSelect(data.payload.devices);
						}
						if (data.payload.profiles) {
							storedProfilesMap = data.payload.profiles;
							populateAllProfiles();
						}
					}
				};
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
	</head>
	<body>
		<div class="sdpi-item">
			<div class="sdpi-item-label">Device ID</div>
			<select id="device" onchange="populateAllProfiles(); update();" class="sdpi-item-value select"></select>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label" id="up-label">Profile</div>
			<select id="profile" onchange="update()" class="sdpi-item-value select"></select>
		</div>
		<div id="encoder" style="display: none">
			<div class="sdpi-item">
				<div class="sdpi-item-label">Dial rotate anticlockwise</div>
				<select id="anticlockwise" onchange="update()" class="sdpi-item-value select"></select>
			</div>
			<div class="sdpi-item">
				<div class="sdpi-item-label">Dial rotate clockwise</div>
				<select id="clockwise" onchange="update()" class="sdpi-item-value select"></select>
			</div>
		</div>
	</body>
</html>
